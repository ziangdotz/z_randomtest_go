[app]
RunMode = "debug" ; "release"

[server]
Port = ":8888"
ReadTimeout = 60
WriteTimeout = 60
IdleTimeout = 120 ; 空闲连接超时 (秒)
MaxRequestBodyMB = 64 ; 请求体大小上限 (MB), 0 = 默认 64
MaxConcurrentJobs = 1 ; 最大并发检测任务数 (CPU 密集), 0 = 默认 1
JobTimeoutSec = 0 ; 异步任务超时 (秒), 0 = 不限
PprofEnable = false ; 是否启用 pprof (仅回环监听, 端口 = Port+1)
